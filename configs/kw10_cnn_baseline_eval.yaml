# Formal clean evaluation of the Milestone 3 baseline (protocol kw10-clean-eval-v1).
# Schema: robust_streaming_ml.evaluation.config.EvaluationConfig (schema_version 1).
# Protocol definitions (splits, metrics, ECE bins, calibration) are fixed in code and
# documented in docs/evaluation-protocol.md; this file only names the inputs.
schema_version: 1
name: kw10-cnn-baseline-eval
seed: 1234               # evaluation is deterministic; the seed is recorded by start_run
deterministic: true
run:
  output_root: runs

data:
  dataset: speech_commands_v0.02_kw10
  manifest_path: data/manifests/speech_commands_v0.02_kw10.csv
  manifest_sha256: f811a20d030ee415fced0b3bc8d7471d6ebdbb4b3d4ee680ec62d8614ab6131c
  validation_report_path: data/reports/speech_commands_v0.02_kw10_validation.json
  audio_root: data/raw/speech_commands_v0.02
  # Quoted: YAML 1.1 reads bare yes/no/on/off as booleans.
  labels: ["yes", "no", "up", "down", "left", "right", "on", "off", "stop", "go"]
  load_workers: 8

checkpoint:
  # Selected in Milestone 3 by lowest validation loss (epoch 18). Git-ignored local artifact.
  path: runs/20260927T210911Z_kw10-cnn-baseline_6c9d6cdf/checkpoints/best.pt
  sha256: d21f89283a128820e93b00d6e104805b3423fd47f2ed8791ba7775d5bf9d267e

evaluation:
  protocol: kw10-clean-eval-v1
  batch_size: 256
  num_threads: 8
