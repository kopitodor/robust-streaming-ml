# Baseline CNN on the validated Speech Commands v0.02 10-keyword manifest.
# Schema: robust_streaming_ml.training.config.TrainingConfig (schema_version 1).
# Run from the repository root: uv run python scripts/train_baseline.py --config <this file>
schema_version: 1
name: kw10-cnn-baseline
seed: 1234
deterministic: true
run:
  output_root: runs

data:
  dataset: speech_commands_v0.02_kw10
  manifest_path: data/manifests/speech_commands_v0.02_kw10.csv
  # Must equal the SHA-256 pinned in SPEECH_COMMANDS_KW10 (docs/datasets/speech_commands_v0.02.md).
  manifest_sha256: f811a20d030ee415fced0b3bc8d7471d6ebdbb4b3d4ee680ec62d8614ab6131c
  validation_report_path: data/reports/speech_commands_v0.02_kw10_validation.json
  audio_root: data/raw/speech_commands_v0.02
  # Quoted: YAML 1.1 reads bare yes/no/on/off as booleans (strict validation rejects them).
  labels: ["yes", "no", "up", "down", "left", "right", "on", "off", "stop", "go"]
  load_workers: 8

window:              # version 1: clip at sample 0, zero-padded to num_samples; never cropped
  version: 1
  sample_rate_hz: 16000
  num_samples: 16000
  alignment: start_zero_pad

features:            # version 1: log-mel, see robust_streaming_ml/features.py
  version: 1
  kind: log_mel
  n_fft: 512         # 32 ms
  win_length: 400    # 25 ms periodic Hann
  hop_length: 160    # 10 ms -> 101 frames per 1 s window
  n_mels: 40
  f_min_hz: 20.0
  f_max_hz: 8000.0
  log_offset: 1.0e-6

model:               # 61,052 trainable parameters with 10 classes
  architecture: kws_cnn_v1
  channels: [16, 32, 64, 64]
  dropout: 0.1

training:
  epochs: 30
  batch_size: 64
  validation_batch_size: 256
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_schedule: cosine          # per-epoch cosine annealing to 0 over `epochs`
  selection_metric: validation_loss
  num_workers: 0
  num_threads: 8
  augmentation:
    enabled: false             # explicit opt-in only
    time_shift_max_ms: 100.0

checkpoint:
  save_last: true
