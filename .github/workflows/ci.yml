name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Pin every uv command, including those in scripts/check_dist.py, to the
      # interpreter installed below.
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: python -m pip install "uv==0.12.13"

      # Populates uv's cache; the distribution check afterwards runs offline.
      - name: Sync environment from lockfile
        run: uv sync --locked

      - name: Run all checks
        run: uv run python scripts/check.py
