[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robust-streaming-ml"
version = "0.1.0"
description = "Planning foundation for reproducible streaming audio classification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Project contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "soundfile>=0.14",
  "torch>=2.2",
]

[dependency-groups]
# Installed next to the built wheel in the isolated distribution check.
smoke = ["pytest>=8.0"]
dev = [
  { include-group = "smoke" },
  # Locked build backend so scripts/check_dist.py can build without network.
  "hatchling>=1.25",
  "mypy>=1.10",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/robust_streaming_ml"]

# CPU-only PyTorch wheels keep the environment small and match the CPU
# inference target in DESIGN.md. Used by `uv sync`/`uv lock`.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "integration: validates the local dataset under data/raw; skipped when it is absent",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "PTH", # prefer pathlib
  "RUF", # ruff-specific
  "NPY", # numpy-specific
]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# soundfile ships no type information; it is used only by the codec corruption.
module = ["soundfile"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
