[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robust-streaming-ml"
version = "0.1.0"
description = "Planning foundation for reproducible streaming audio classification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Project contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/robust_streaming_ml"]
